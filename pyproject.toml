[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lore-knowledge-mcp"
version = "0.6.0"
description = "Unified knowledge management MCP server with document intelligence and research workflows"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "David Gutowsky"},
]
keywords = ["mcp", "knowledge-management", "ai", "claude", "research", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=0.4.0",
    "fastmcp>=3.3.1",
    "aiofiles>=23.2.1",
    "asyncpg>=0.28.0",
    "jsonschema>=4.17.0",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.0.0",
    "markdown>=3.4.0",
    "tiktoken>=0.5.0",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9.7",
    "sentry-sdk>=1.32.0",
]

[project.optional-dependencies]
supabase = [
    "supabase>=1.0.0",
]
semantic = [
    # Sentence-transformers ONNX-backed inference for local embeddings.
    # Pin sqlite-vec exactly: it is pre-1.0 and may break API between minor versions.
    "sentence-transformers>=2.7.0",
    "sqlite-vec==0.1.9",
    "onnxruntime>=1.17.0",
    "optimum[onnxruntime]>=1.17.0",
    # PostgreSQL semantic search support (Phase 2 / Issue #6).
    # Registers vector/halfvec adapters with psycopg2 so list[float] casts cleanly.
    "pgvector>=0.2.5",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1",
    "pre-commit>=3.3.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.22.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "factory-boy>=3.3.0",
]

[project.scripts]
lore-mcp = "lore.server:main"

[project.urls]
Homepage = "https://github.com/davidgut1982/lore-mcp"
Documentation = "https://github.com/davidgut1982/lore-mcp#readme"
Repository = "https://github.com/davidgut1982/lore-mcp.git"
Issues = "https://github.com/davidgut1982/lore-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lore = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",   # line too long — handler code has long strings
    "UP007",  # X | Y union syntax — keep Optional[] for clarity
    "F401",   # unused imports — some are re-exported
]

[tool.ruff.lint.isort]
known-first-party = ["lore"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
