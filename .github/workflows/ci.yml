name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        # Lint AND format-check all source trees (src, tests). Run these exact
        # commands locally before pushing:
        #   ruff check src/ tests/
        #   ruff format src/ tests/ --check
        run: |
          ruff check src/ tests/
          ruff format src/ tests/ --check

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        env:
          DB_BACKEND: sqlite
          KNOWLEDGE_DATA_DIR: /tmp/lore-test-ci

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image required: _init_schema probes for the vector extension
        # and creates kb_embeddings / HNSW index when LORE_SEMANTIC_SEARCH=true.
        # Telemetry + hard_negative_pairs tables are also auto-created by _init_schema.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lore_user
          POSTGRES_PASSWORD: lore
          POSTGRES_DB: lore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lore_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Bootstrap Postgres schema
        # Loads the base knowledge schema that LocalPostgresClient._init_schema
        # expects to find. The rest (kb_embeddings, retrieval_telemetry,
        # hard_negative_pairs) is auto-created by _init_schema on first connect.
        env:
          PGPASSWORD: lore
        run: |
          psql -h localhost -U lore_user -d lore \
            -f scripts/ci_bootstrap_schema.sql

      - name: Run integration tests
        env:
          DB_BACKEND: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: lore
          DB_USER: lore_user
          DB_PASSWORD: lore
          LORE_HARD_NEGATIVE_MINING: "true"
          LORE_ENV: staging
          KNOWLEDGE_DATA_DIR: /tmp/lore-test-ci
        run: pytest tests/integration/ -v --tb=short -m "integration or slow"
